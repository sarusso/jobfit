<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobFit{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👔</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .03em; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">&#128084; JobFit</a>
      <div class="d-flex gap-2">
        {% if user.is_authenticated %}
          <a href="/jobs/" class="btn btn-sm btn-outline-light">&#128188; Jobs</a>
          <a href="/account/" class="btn btn-sm btn-outline-light">&#128100; Account</a>
          <a href="/logout/" class="btn btn-sm btn-outline-light">Logout</a>
        {% else %}
          <a href="/login/" class="btn btn-sm btn-outline-light">Login</a>
          <a href="/register/" class="btn btn-sm btn-outline-light">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  {% if messages %}
  <div class="container mb-3">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show py-2" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
